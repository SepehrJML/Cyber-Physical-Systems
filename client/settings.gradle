pluginManagement {
    repositories {
        maven { url 'https://maven.myket.ir' }
        maven { url 'https://mirror.sharif.edu/nexus/content/groups/public/' }
        maven { url 'https://dl.devneeds.ir/android/repository/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://maven.myket.ir' }
        maven { url 'https://mirror.sharif.edu/nexus/content/groups/public/' }
        maven { url 'https://dl.devneeds.ir/android/repository/' }
        mavenCentral()
    }
}

rootProject.name = "tst2"
include ':app'